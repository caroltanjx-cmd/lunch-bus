name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The code-review plugin is fetched at a fixed commit (outside the workspace being reviewed)
      # and loaded with --plugin-dir. plugin_marketplaces can't pin a commit, and Claude Code refuses
      # a local copy of the official marketplace because its name is reserved.
      # To update: replace the SHA with a newer commit of anthropics/claude-code.
      - name: Fetch pinned code-review plugin
        env:
          MARKETPLACE_SHA: 765f236fe1bfcc678e0ec59af9170fb7d6771a3a
        run: |
          git init -q "$RUNNER_TEMP/claude-code"
          git -C "$RUNNER_TEMP/claude-code" fetch -q --depth 1 https://github.com/anthropics/claude-code.git "$MARKETPLACE_SHA"
          git -C "$RUNNER_TEMP/claude-code" checkout -q FETCH_HEAD

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@58985842b834ed26087302ba27d07bc24ca8697a # v1.0.244
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--plugin-dir ${{ runner.temp }}/claude-code/plugins/code-review --allowedTools "mcp__github_inline_comment__create_inline_comment"'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

